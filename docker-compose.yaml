services:
  postgres:
    image: 'postgres:13-alpine'
    restart: unless-stopped
    ports:
      - '${HOST_BIND_IP:-127.0.0.1}:${HOST_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-naz4riteam}'
      POSTGRES_USER: '${POSTGRES_USER:-naz4riteam}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      PGDATA: '/var/lib/postgresql/data/pgdata'
    volumes:
      - 'davinci-pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD','pg_isready','-U','${POSTGRES_USER:-naz4riteam}','-d','${POSTGRES_DB:-naz4riteam}']
      interval: 10s

  backup:
    image: 'prodrigestivill/postgres-backup-local:13'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: '${POSTGRES_DB:-naz4riteam}'
      POSTGRES_USER: '${POSTGRES_USER:-naz4riteam}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_EXTRA_OPTS: '--blobs --format=custom --quote-all-identifiers'
      BACKUP_SUFFIX: '.backup'
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: '14'
      BACKUP_KEEP_WEEKS: '8'
      BACKUP_KEEP_MONTHS: '12'
      HEALTHCHECK_PORT: '8080'
    volumes:
      - 'davinci-backups:/backups'

  pgadmin:
    image: 'dpage/pgadmin4:latest'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: '${PGADMIN_EMAIL:-mpvillafranca94@gmail.com}'
      PGADMIN_DEFAULT_PASSWORD: '${PGADMIN_PASSWORD}'
      PGADMIN_LISTEN_PORT: '80'
      # pgAdmin ata la sesion a la IP del cliente. Detras de un CDN cada
      # peticion llega por un edge distinto —se contaron 10 IPs en 2 minutos—,
      # asi que la sesion se invalidaba sola y /login y /browser/ se
      # redirigian mutuamente en un bucle infinito, con la pagina cargando
      # para siempre. Quien entra ya viene autenticado por Authentik, que es
      # el control que de verdad protege esto.
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: '${PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION:-False}'
    volumes:
      - 'davinci-pgadmin:/var/lib/pgadmin'

volumes:
  davinci-pgdata:
  davinci-backups:
  davinci-pgadmin:
