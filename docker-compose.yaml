# DaVinci Resolve Project Server — naz4ri fork (base: elliotmatson/Docker-Davinci-Resolve-Project-Server).
# Adaptado para Coolify + Cloudflare Tunnel: postgres 13 (versión oficial DaVinci),
# backups .backup rolling, pgAdmin 4 con dominio propio.
services:
  postgres:
    image: 'postgres:13-alpine'
    restart: unless-stopped
    ports:
      - '${HOST_BIND_IP:-127.0.0.1}:${HOST_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-naz4riteam}'
      POSTGRES_USER: '${POSTGRES_USER:-naz4riteam}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      PGDATA: '/var/lib/postgresql/data/pgdata'
    volumes:
      - 'davinci-pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD','pg_isready','-U','${POSTGRES_USER:-naz4riteam}','-d','${POSTGRES_DB:-naz4riteam}']
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: 'prodrigestivill/postgres-backup-local:13'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: '${POSTGRES_DB:-naz4riteam}'
      POSTGRES_USER: '${POSTGRES_USER:-naz4riteam}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_EXTRA_OPTS: '--blobs --format=custom --quote-all-identifiers'
      BACKUP_SUFFIX: '.backup'
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: '14'
      BACKUP_KEEP_WEEKS: '8'
      BACKUP_KEEP_MONTHS: '12'
      HEALTHCHECK_PORT: '8080'
    volumes:
      - 'davinci-backups:/backups'
    healthcheck:
      test: ['CMD','wget','-qO-','http://127.0.0.1:8080']
      interval: 30s

  pgadmin:
    image: 'dpage/pgadmin4:latest'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: '${PGADMIN_EMAIL:-mpvillafranca94@gmail.com}'
      PGADMIN_DEFAULT_PASSWORD: '${PGADMIN_PASSWORD}'
      PGADMIN_LISTEN_PORT: '80'
    volumes:
      - 'davinci-pgadmin:/var/lib/pgadmin'
      - 'davinci-backups:/var/lib/pgadmin/storage/mpvillafranca94_gmail.com/backups:ro'
    healthcheck:
      test: ['CMD','wget','--no-verbose','--tries=1','--spider','http://127.0.0.1/misc/ping']
      interval: 30s

volumes:
  davinci-pgdata:
  davinci-backups:
  davinci-pgadmin:
